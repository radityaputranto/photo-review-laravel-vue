services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fotoapp-prod:latest
    restart: always
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - storage-data:/var/www/html/storage
      - public-data:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  web:
    image: nginx:alpine
    restart: always
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # The web server needs access to the public files built by the app and uploaded storage
      - public-data:/var/www/html/public
      - storage-data:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-fotoapp}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  db-data:
  storage-data:
  public-data:

networks:
  app-network:
    driver: bridge
