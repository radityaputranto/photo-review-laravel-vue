services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fotoapp-prod:latest
    restart: always
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - storage-data:/var/www/html/storage
      - public-data:/var/www/html/public
    depends_on:
      - db
    networks:
      - app-network

  web:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # The web server needs access to the public files built by the app
      - public-data:/var/www/html/public
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-fotoapp}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

volumes:
  db-data:
  storage-data:
  public-data:

networks:
  app-network:
    driver: bridge
